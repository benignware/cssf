<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Partials with Slots and Parts</title>
    <link rel="stylesheet" href="/bootstrap/dist/index.css">
    <style>
        /* Simple styles for demonstration */
        nav a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#/" data-part="/bootstrap/parts/home.html" data-slot="main">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/about" data-part="/bootstrap/parts/about.html" data-slot="main">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/contact" data-part="/bootstrap/parts/contact.html" data-slot="main">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-4" data-slot="sidebar" data-part="/bootstrap/parts/sidebar.html"></div>
            
            <!-- Main content area -->
            <div class="col-md-8" data-slot="main" data-part="/bootstrap/parts/home.html"></div>
        </div>
    </div>
    <script src="/bootstrap/loadPartials.mjs" type="module"></script>
</body>
</html>
