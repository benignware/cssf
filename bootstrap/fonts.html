<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Selector</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/bootstrap/dist/index.css">
    <style>
        .font-selector {
            position: relative;
            display: inline-block;
        }
        .font-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            display: none;
            border: 1px solid #ced4da;
            background: white;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
        }
        .font-dropdown .dropdown-item {
            cursor: pointer;
        }
        .font-dropdown .dropdown-item:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="font-selector" data-type="font">
            <input type="text" id="fontInput" class="form-control" placeholder="Select a font" />
            <div id="fontDropdown" class="font-dropdown dropdown-menu">
                <!-- Dropdown items will be injected here by fontInput.mjs -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>

    <!-- Import the fontInput module -->
    <script type="module" src="setupFonts.mjs"></script>
</body>
</html>
