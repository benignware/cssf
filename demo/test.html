<body>
    <h1>SCSS to CSS Example</h1>
    <div class="test">
      Hello World

    <script type="importmap">
        {
          "imports": {
            "sass": "https://jspm.dev/sass",
            "css-tree": "https://jspm.dev/css-tree",

    <script type="module">
      import * as sass from 'sass';
      import scssf from 'cssf/peer/sass';

      console.log('scssf', scssf.env);

        const INPUT = './main.scss'; // The SCSS file to fetch and compile

        async function loadAndCompileScss(url) {

          console.log('loadAndCompileScss', url);
            // try {
              // const sass = await import('https://jspm.dev/sass');
              
              console.log('sass', sass);
              console.log('ss sass.compileString', sass.compileString);

              // Fetch the SCSS file
              const response = await fetch(url);
              if (!response.ok) {
                  throw new Error(`HTTP error! Status: ${response.status}`);
              }
              const scssContent = await response.text();

              function helloWorld(a = 'Hello', b = 'World') {
                console.log('helloWorld   A:', a, 'B:', b);
                return `"${a} ${b}"`;
              }

              scssf.clear();

              scssf.use(helloWorld);

              console.log('scssf', scssf.env);

              const css = scssf(scssContent);

              console.log(css);

              // Create a <style> element with the compiled CSS
              const style = document.createElement('style');
              style.textContent = css;
              document.head.appendChild(style);
        }

        // Load and compile the SCSS file on page load
        console.log('INPUT', INPUT);
        loadAndCompileScss(INPUT);
    </script>
