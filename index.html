<body>
    <h1>CSSF Example</h1>
    <script type="importmap">
        {
          "imports": {
            "css-tree": "https://jspm.dev/css-tree",
            "change-case": "https://jspm.dev/change-case",
            "lodash.memoize": "https://jspm.dev/lodash.memoize",
            "cssf": "./index.mjs"
          }
        }
    </script>
    <script type="module">
      import cssf from 'cssf';

      const INPUT = './index.css'; // The SCSS file to fetch and compile

      const main = async () => {
        console.log('Fetching CSS file', INPUT);
        // Fetch the css file
        const response = await fetch(INPUT);
        const data = await response.text();
        console.log('COMPILING CSS', data);
        // Compile
        const css = cssf(data);

        console.log('AFTER CSS', css);

        // Create a style element and append the compiled CSS
        const style = document.createElement('style');
        style.innerHTML = css;
        document.head.appendChild(style);
      };

      main();

    </script>
